name: Weekly link check

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check opt-out links
        id: check
        continue-on-error: true
        run: python3 tools/check_links.py
      - name: Open or update an issue if links are broken
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Broken opt-out links"
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          { echo "The weekly check found broken links ($(date -u +%Y-%m-%d))."; echo; cat link-report.md; } > body.md
          if [ -n "$num" ]; then gh issue comment "$num" --body-file body.md; else gh issue create --title "$title" --body-file body.md; fi
